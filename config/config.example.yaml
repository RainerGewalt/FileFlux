# Optional YAML config. Every field can be overridden by a TRAILTRANSFER_* env
# var (see .env.example). The docker-compose demo uses env only; this file shows
# the equivalent file-based form: trailtransfer run --config /config/config.yaml
worker_id: worker-01
topic_prefix: trailtransfer

mqtt:
  host: mqtt
  port: 1883
  username: ""
  password: ""
  keep_alive_seconds: 30

policy_file: /config/worker-policy.yaml
rclone_config: /config/rclone.conf
rclone_binary: rclone

# Append-only evidence journal (JSONL). Empty = in-memory chain only.
evidence_journal: /data/evidence/journal.jsonl
# Optional PEM Ed25519 private key to sign records (trailtransfer keygen).
# signing_key: /config/worker-01.key

max_parallel_jobs: 2
health_interval_seconds: 30
log_level: info
